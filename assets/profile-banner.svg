<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mo Sharif</title>
  <desc id="desc">Staff-level engineer focused on full-stack Next.js and applied AI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b12" />
      <stop offset="0.56" stop-color="#0d1320" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>

    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#background)" stroke="#263244" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#grid)" />
  <circle cx="1004" cy="154" r="220" fill="url(#glow)" />
  <rect x="56" y="42" width="132" height="4" rx="2" fill="url(#accent)" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace">
    <text x="56" y="80" fill="#8b9bb4" font-size="15" letter-spacing="2">MO@SHARIF:~$ BUILD USEFUL SYSTEMS</text>
    <text x="52" y="164" fill="#f8fafc" font-size="66" font-weight="750" letter-spacing="-2">MO SHARIF</text>
    <text x="56" y="208" fill="#cbd5e1" font-size="20" letter-spacing="1.2">STAFF-LEVEL ENGINEER / FULL-STACK NEXT.JS / APPLIED AI</text>

    <g transform="translate(56 242)">
      <rect width="128" height="34" rx="8" fill="#ff6b35" fill-opacity="0.12" stroke="#ff6b35" stroke-opacity="0.72" />
      <text x="64" y="22" fill="#ffb08f" font-size="13" text-anchor="middle" letter-spacing="1">PRODUCT</text>

      <rect x="142" width="128" height="34" rx="8" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.62" />
      <text x="206" y="22" fill="#8be9f7" font-size="13" text-anchor="middle" letter-spacing="1">SYSTEMS</text>

      <rect x="284" width="128" height="34" rx="8" fill="#f8fafc" fill-opacity="0.06" stroke="#94a3b8" stroke-opacity="0.46" />
      <text x="348" y="22" fill="#d7e0ec" font-size="13" text-anchor="middle" letter-spacing="1">PRODUCTION</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 802 102 L 904 70 L 1010 112 L 1110 76" stroke="#334155" stroke-width="3" />
    <path d="M 802 102 L 872 182 L 980 158 L 1092 218" stroke="#334155" stroke-width="3" />
    <path d="M 872 182 L 840 252" stroke="#334155" stroke-width="3" />
    <path d="M 980 158 L 1018 250" stroke="#334155" stroke-width="3" />
    <path d="M 904 70 L 980 158" stroke="url(#accent)" stroke-opacity="0.76" stroke-width="3" />
  </g>

  <g filter="url(#soft-glow)">
    <circle cx="802" cy="102" r="8" fill="#ff6b35" />
    <circle cx="904" cy="70" r="7" fill="#f8fafc" />
    <circle cx="1010" cy="112" r="9" fill="#22d3ee" />
    <circle cx="1110" cy="76" r="6" fill="#f8fafc" />
    <circle cx="872" cy="182" r="9" fill="#22d3ee" />
    <circle cx="980" cy="158" r="11" fill="#ff6b35" />
    <circle cx="1092" cy="218" r="8" fill="#22d3ee" />
    <circle cx="840" cy="252" r="6" fill="#f8fafc" />
    <circle cx="1018" cy="250" r="7" fill="#f8fafc" />
  </g>

  <text x="1128" y="286" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12" text-anchor="end" letter-spacing="2">SHIP / VERIFY / REFINE</text>
</svg>
