<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Mo Sharif: Big ideas. Working software.</title>
  <desc id="desc">An editorial black-and-cream banner with a vermilion asterisk and a stepped path from an idea to a working product. Full-stack Next.js, applied AI, and a human point of view.</desc>

  <rect width="1280" height="420" fill="#f4f1e9" />
  <rect x="12" y="12" width="1256" height="396" fill="#191a18" />

  <g font-family="Arial, Helvetica, sans-serif" fill="#f4f1e9">
    <text x="52" y="60" font-size="24" font-weight="700" letter-spacing="-0.6">MO SHARIF</text>
    <text x="1228" y="59" font-family="Courier New, monospace" font-size="14" text-anchor="end" letter-spacing="1.8">ENGINEER / BUILDER / AUTHOR</text>
    <path d="M52 83H1228" stroke="#5c5d57" />

    <text x="47" y="195" font-size="94" font-weight="800" letter-spacing="-5">Big ideas.</text>
    <text x="47" y="292" font-size="94" font-weight="800" letter-spacing="-5">Working software.</text>

    <g transform="translate(1103 170)" stroke="#ff6845" stroke-width="17">
      <path d="M-61 0H61M0-61V61M-43-43L43 43M-43 43L43-43" />
    </g>

    <g fill="none" stroke="#ff6845" stroke-width="2">
      <path d="M973 294H1035V264H1097V234H1159" />
      <path d="M1149 226L1159 234L1149 242" />
      <circle cx="968" cy="294" r="5" fill="#191a18" />
    </g>

    <path d="M52 332H1228" stroke="#5c5d57" />
    <g font-family="Courier New, monospace" font-size="16">
      <text x="52" y="374" letter-spacing="0.4">FULL-STACK NEXT.JS + APPLIED AI</text>
      <circle cx="570" cy="368" r="3" fill="#ff6845" />
      <text x="588" y="374">A HUMAN POINT OF VIEW.</text>
      <text x="1228" y="374" fill="#b3b5aa" text-anchor="end">COLORADO, USA</text>
    </g>
  </g>
</svg>
